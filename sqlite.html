<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SQLite Tables (WebSocket)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.min.js"></script>
</head>
<body>
  <div style="margin-bottom: 10px;">
    <button onclick="requestRefresh()">手动刷新数据</button>
    <span id="status" style="margin-left: 10px; color: gray;">正在连接 WebSocket...</span>
  </div>
  <div id="tables" style="display:flex;flex-wrap:wrap;"></div>

  <script>
    let ws = null;
    let SQL = null;

    async function init() {
      // 初始化 sql.js
      SQL = await initSqlJs({
        locateFile: file => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + file
      });

      connectWebSocket();
    }

    function connectWebSocket() {
      const statusEl = document.getElementById('status');
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);
      
      // 关键：设置接收二进制数据格式为 arraybuffer
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        statusEl.textContent = 'WebSocket 已连接';
        statusEl.style.color = 'green';
      };

      ws.onmessage = (event) => {
        try {
          const buffer = event.data;
          if (buffer.byteLength === 0) {
            console.warn('收到的数据库文件为空');
            return;
          }

          // 解析并渲染数据库
          const db = new SQL.Database(new Uint8Array(buffer));
          renderTables(db);
          statusEl.textContent = '数据已更新: ' + new Date().toLocaleTimeString();
        } catch (e) {
          console.error('解析数据库失败:', e);
          statusEl.textContent = '解析数据库出错';
          statusEl.style.color = 'red';
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'WebSocket 连接断开，3秒后重连...';
        statusEl.style.color = 'red';
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (err) => {
        console.error('WebSocket 错误:', err);
      };
    }

    function requestRefresh() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('get_db');
      }
    }

    function renderTables(db) {
      const container = document.getElementById('tables');
      container.innerHTML = ''; // 清空旧表格

      const result = db.exec("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name");
      if (result.length === 0) return;

      result[0].values.forEach(row => {
        const tableName = row[0];
        const section = document.createElement('div');
        section.style.flex = '0 0 calc(100% / 13)';
        section.style.boxSizing = 'border-box';
        section.style.padding = '4px';
        section.style.border = '1px solid #ccc';
        section.style.margin = '2px';

        const title = document.createElement('h6');
        title.textContent = tableName;
        title.style.margin = '0 0 4px 0';
        section.appendChild(title);

        const tableData = db.exec("SELECT * FROM [" + tableName + "]");
        if (tableData.length === 0) {
          const empty = document.createElement('span');
          empty.textContent = '(空表)';
          section.appendChild(empty);
        } else {
          const cols = tableData[0].columns;
          const rows = tableData[0].values;

          const tableEl = document.createElement('table');
          tableEl.style.borderCollapse = 'collapse';
          tableEl.style.fontSize = '12px';

          const thead = document.createElement('thead');
          const headRow = document.createElement('tr');
          cols.forEach(c => {
            const th = document.createElement('th');
            th.textContent = c;
            th.style.border = '1px solid #ccc';
            th.style.padding = '2px 4px';
            th.style.background = '#f0f0f0';
            headRow.appendChild(th);
          });
          thead.appendChild(headRow);
          tableEl.appendChild(thead);

          const tbody = document.createElement('tbody');
          rows.forEach(r => {
            const tr = document.createElement('tr');
            r.forEach(v => {
              const td = document.createElement('td');
              td.textContent = v === null ? 'NULL' : String(v);
              td.style.border = '1px solid #ccc';
              td.style.padding = '2px 4px';
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          tableEl.appendChild(tbody);
          section.appendChild(tableEl);
        }

        container.appendChild(section);
      });
    }

    init();
  </script>
</body>
</html>
